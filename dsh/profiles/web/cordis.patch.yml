# User patch layer for the web profile, applied after every bundle layer.
# deepeye-vision (id-targeted override): replaces the config of the bundle's
# inserted row wholesale — route all vision calls to Zhipu GLM-4.6V (paid).
# API key comes from $DEEPEYE_API_KEY, set in ~/.dsh/.env.
# NOTE: glm-4.6v is a thinking model — keep maxTokens >= 8192 or its reasoning
# can exhaust the budget and return an empty answer on complex figures.
- id: deepeye-vision
  config:
    provider: custom
    baseUrl: 'https://open.bigmodel.cn/api/paas/v4'
    model: glm-4.6v
    maxTokens: 8192

# Disable the dsh-ads bundle row entirely (id-targeted override, same
# mechanism as the telemetry switch: `disabled: true` on a patch row).
- id: dsh-ads
  disabled: true
